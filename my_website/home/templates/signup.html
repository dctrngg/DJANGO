{% extends 'base.html' %}

{% block content %}

<div class="container" style="margin-top: 70px; width: 3000px">
    <div class="p-3 m-3">
                <div class="text-center col">
                    <h1>Đăng Ký</h1>
                </div>
                <!--<h3 class="alert alert-light rounded-pill" style="text-align:center" >Tạo tài khoản</h3>-->
                <form action="/signup" method="POST">

                    {% csrf_token %}

                    {% if error%}
                    <div class="alert alert-danger" role="alert">
                        {{error}}
                    </div>
                    {% endif %}
                    <!-- firstname -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="">Tên</label>
                                <input type="text" name="firstname"
                             id="firstname" value="{{values.first_name}}" class="form-control form-control-sm"
                             placeholder="">
                            </div>

                            <!-- last name -->
                            <div class="form-group">
                                <label for="">Họ</label>
                                <input type="text" name="lastname"
                                id="lastname" value="{{values.last_name}}" class="form-control form-control-sm">
                            </div>

                            <!--Gender-->
                            <div class="form-group">
                            <label>Giới tính</label>
                            <select class="form-control" id="gender">
                              <option>Nam</option>
                              <option>Nữ</option>
                              <option>Khác</option>
                            </select>
                            </div>
                        </div>

                    <!-- phone -->

                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="">Số điện thoại</label>
                                <input type="text" name="phone"
                                id="phone" class="form-control form-control-sm"
                                value="{{values.phone}}"
                                placeholder="9876543210"
                                >
                            </div>
                            <!-- email -->
                            <div class="form-group">
                                <label for="">Email</label>
                                <input required type="email" name="email" id="email"
                                value="{{values.email}}"
                                class=" form-control-sm form-control" placeholder="abc@gmail.com">
                            </div>


                            <!-- password -->
                            <div class="form-group">
                                <label for="password">Mật khẩu</label>
                                <input type="password"
                                name="password"
                                id="password"
                                 class="form-control form-control-sm">
                            </div>
                        </div>
                    </div>

                    <!--Checkme button-->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label d-grid gap-2" for="exampleCheck1">Ghi nhớ</label>
                    </div>
                    <hr>
                    <button type="submit" class="btn btn-sm btn-success col-lg-12">Tạo tài khoản mới</button>

                </form>
        </div>
    </div>
</div>

{% endblock %}
